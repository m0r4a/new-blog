baseURL = "https://blog.gmora.work/"
title = "Mora's blog"
locale = "en-US"
enableGitInfo = true
enableRobotsTXT = true

[params]
author = "Gael Mora Aguirre"
mainSections = ["posts", "cheatsheets"]
# Empty values are hidden.
github = "https://github.com/m0r4a"
linkedin = "https://www.linkedin.com/in/moracodes/"
email = "m0r4a@proton.me"

[[menus.main]]
name = "Posts"
pageRef = "/posts"
weight = 1
[[menus.main]]
name = "Cheatsheets"
pageRef = "/cheatsheets"
weight = 2

[frontmatter]
date = ["date", "publishDate", ":git", ":fileModTime"]
lastmod = [":git", "lastmod", ":fileModTime"]

[taxonomies]
tag = "tags"

[markup.goldmark.renderer]
unsafe = true

[markup.goldmark.extensions.passthrough]
enable = true
[markup.goldmark.extensions.passthrough.delimiters]
block = [["$$", "$$"], ["\\[", "\\]"]]
inline = [["$", "$"], ["\\(", "\\)"]]

[markup.highlight]
noClasses = false
